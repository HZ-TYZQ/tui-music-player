<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Music Player icon — compact</title>
  <desc id="description">A compact dark terminal icon with heavy cyan-to-magenta spectrum lines for small sizes.</desc>
  <defs>
    <linearGradient id="spectrum" x1="128" y1="0" x2="896" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14D2DC"/>
      <stop offset="1" stop-color="#DC46B4"/>
    </linearGradient>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="180" fill="#10151D"/>
  <rect x="53" y="53" width="918" height="918" rx="175" fill="none" stroke="#2B3343" stroke-width="10"/>

  <path d="M150 198 L226 252 L150 306" fill="none" stroke="#14D2DC" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke="url(#spectrum)" stroke-width="20">
    <circle cx="710" cy="252" r="23"/>
    <circle cx="790" cy="252" r="23"/>
    <circle cx="870" cy="252" r="23"/>
  </g>

  <path d="M128 344 H896" fill="none" stroke="#3E475A" stroke-width="24" stroke-linecap="round"/>

  <g fill="none" stroke="url(#spectrum)" stroke-width="30" stroke-linejoin="round">
    <rect x="140" y="580" width="84" height="290" rx="16"/>
    <rect x="270" y="460" width="84" height="410" rx="16"/>
    <rect x="400" y="650" width="84" height="220" rx="16"/>
    <rect x="530" y="550" width="84" height="320" rx="16"/>
    <rect x="660" y="700" width="84" height="170" rx="16"/>
    <rect x="790" y="410" width="84" height="460" rx="16"/>
  </g>
</svg>
