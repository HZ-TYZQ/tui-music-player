<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Music Player icon — balanced</title>
  <desc id="description">A dark rounded terminal window containing a cyan-to-magenta six-bar audio spectrum.</desc>
  <defs>
    <linearGradient id="spectrum" x1="160" y1="0" x2="864" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14D2DC"/>
      <stop offset="1" stop-color="#DC46B4"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="196" fill="#151922"/>
  <rect x="68" y="68" width="888" height="888" rx="192" fill="none" stroke="#2A3040" stroke-width="8"/>

  <path d="M180 208 L248 256 L180 304" fill="none" stroke="#14D2DC" stroke-width="28"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke="url(#spectrum)" stroke-width="16">
    <circle cx="704" cy="256" r="20"/>
    <circle cx="772" cy="256" r="20"/>
    <circle cx="840" cy="256" r="20"/>
  </g>

  <path d="M160 360 H864" fill="none" stroke="#3B4253" stroke-width="18" stroke-linecap="round"/>

  <g fill="none" stroke="url(#spectrum)" stroke-width="24" stroke-linejoin="round">
    <rect x="172" y="574" width="72" height="270" rx="14"/>
    <rect x="292" y="476" width="72" height="368" rx="14"/>
    <rect x="412" y="650" width="72" height="194" rx="14"/>
    <rect x="532" y="548" width="72" height="296" rx="14"/>
    <rect x="652" y="694" width="72" height="150" rx="14"/>
    <rect x="772" y="426" width="72" height="418" rx="14"/>
  </g>
</svg>
