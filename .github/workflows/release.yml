name: Fedora RPM release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build tools
        run: |
          dnf install -y \
            git rust cargo rpm-build tar gzip findutils \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            gstreamer1-plugins-bad-free-devel \
            sqlite-devel
      - uses: actions/checkout@v4
      - name: Build RPM and SRPM
        run: ./packaging/build-rpm.sh
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packaging/rpmbuild/RPMS/**/*.rpm
            packaging/rpmbuild/SRPMS/*.rpm
