name: Fedora RPM release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$REQUESTED_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Install build tools
        run: |
          dnf install -y \
            git rust cargo rpm-build tar gzip findutils \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            gstreamer1-plugins-bad-free-devel \
            gstreamer1-plugins-good \
            sqlite-devel
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
      - name: Build RPM and SRPM
        run: ./packaging/build-rpm.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: |
            packaging/rpmbuild/RPMS/**/*.rpm
            packaging/rpmbuild/SRPMS/*.rpm
