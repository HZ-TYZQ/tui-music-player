name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-good \
            libsqlite3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Install GStreamer MSVC development files
        shell: pwsh
        run: >-
          ./packaging/windows/install-gstreamer.ps1
          -InstallDir "$env:RUNNER_TEMP\gstreamer"
          -InstallType devel
          -ExportGitHubEnvironment
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked
      - name: Build release binary
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: windows-binary
          path: target/release/music-player.exe
          if-no-files-found: error

  # Compile the installer and validate install/uninstall behavior on every
  # push and pull request, not only on tagged release builds, so packaging
  # regressions (ISS script, license staging, launcher) surface in regular CI.
  windows-package:
    needs: windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve project version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: windows-binary
          path: windows-binary
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Install private GStreamer runtime
        shell: pwsh
        run: >-
          ./packaging/windows/install-gstreamer.ps1
          -InstallDir "$env:RUNNER_TEMP\gstreamer-runtime"
          -InstallType runtime
      - name: Build Portable ZIP and Installer
        shell: pwsh
        run: >-
          ./packaging/windows/package-windows.ps1
          -ProjectDir "$env:GITHUB_WORKSPACE"
          -RuntimeDir "$env:RUNNER_TEMP\gstreamer-runtime"
          -MusicPlayerExe "$env:GITHUB_WORKSPACE\windows-binary\music-player.exe"
          -Version "${{ steps.version.outputs.version }}"
          -OutputDir "$env:RUNNER_TEMP\windows-dist"
      - name: Test Installer behavior
        shell: pwsh
        run: >-
          ./packaging/windows/test-installer.ps1
          -SetupPath "$env:RUNNER_TEMP\windows-dist\music-player-${{ steps.version.outputs.version }}-windows-x86_64-setup.exe"
      - name: Retain packages for diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-packages-ci
          path: ${{ runner.temp }}/windows-dist/*
          if-no-files-found: ignore
